version: 2

models:
  - name: stg_customers
    description: "Standardized customer records."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_name
        data_tests:
          - not_null

  - name: stg_products
    description: "Product catalog with prices in cents and dollars."
    columns:
      - name: product_sku
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: product_type
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null

  - name: stg_stores
    description: "Store details and tax rates."
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
      - name: store_name
        data_tests:
          - not_null
      - name: opened_at
        data_tests:
          - not_null
      - name: tax_rate
        data_tests:
          - not_null

  - name: stg_orders
    description: "One record per order."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: ordered_at
        data_tests:
          - not_null
      - name: subtotal
        data_tests:
          - not_null
      - name: tax_paid
        data_tests:
          - not_null
      - name: order_total
        data_tests:
          - not_null

  - name: stg_order_items
    description: "One record per order item."
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_sku
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_sku